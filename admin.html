<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ตรวจสอบจุดเสี่ยง</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <style>
        body { font-family: 'Sarabun', sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; color: #333; }
        header { background-color: #333; color: white; padding: 1.2rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.4rem; }
        .back-link { color: #fff; text-decoration: none; background: #d32f2f; padding: 8px 15px; border-radius: 6px; font-size: 0.9rem; }
        
        main { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .pending-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; gap: 20px; align-items: flex-start; }
        
        .mini-map { width: 220px; height: 150px; border-radius: 6px; border: 1px solid #ccc; z-index: 1; flex-shrink: 0; }
        
        .pending-info { flex: 1; }
        .pending-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; color: #d32f2f; }
        .pending-detail { font-size: 0.95rem; color: #555; margin-bottom: 8px; }
        .pending-meta { font-size: 0.85rem; color: #666; margin-bottom: 12px; }
        .pending-img { width: 120px; height: 90px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; margin-bottom: 10px; display: block; }
        
        .btn-group { display: flex; gap: 10px; }
        button { padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: inherit; font-size: 0.95rem; }
        .btn-approve { background-color: #4caf50; color: white; }
        .btn-approve:hover { background-color: #388e3c; }
        .btn-reject { background-color: #d32f2f; color: white; }
        .btn-reject:hover { background-color: #b71c1c; }
        
        .empty-state { text-align: center; padding: 50px; color: #888; font-size: 1.1rem; background: white; border-radius: 8px; }
    </style>
</head>
<body>

    <header>
        <h1>🛠️ ระบบจัดการหลังบ้านแอดมิน (Admin Approval)</h1>
        <a href="index.html" class="back-link">⬅️ กลับหน้าแผนที่หลัก</a>
    </header>

    <main>
        <h2>📋 รายการจุดเสี่ยงที่รอการตรวจสอบ (Pending)</h2>
        <div id="pending-list">
            <div class="empty-state">กำลังโหลดข้อมูล...</div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAKl0r6snz3-QsYJz8_Dj5Ejow5Gi7q9lA",
            authDomain: "safe-zone-mapping.firebaseapp.com",
            databaseURL: "https://safe-zone-mapping-default-rtdb.asia-southeast1.firebasedatabase.app", 
            projectId: "safe-zone-mapping",
            storageBucket: "safe-zone-mapping.firebasestorage.app",
            messagingSenderId: "643757597662",
            appId: "1:643757597662:web:7d7a770dbe82ccce86b34f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('safeZonePins').on('value', (snapshot) => {
            const listEl = document.getElementById('pending-list');
            listEl.innerHTML = '';
            const data = snapshot.val();
            
            let hasPending = false;

            if (data) {
                Object.keys(data).forEach(key => {
                    const pin = data[key];
                    
                    if (pin.status === 'pending') {
                        hasPending = true;
                        
                        const timeString = new Date(pin.timestamp).toLocaleString('th-TH', { dateStyle: 'full', timeStyle: 'medium' });
                        
                        let riskText = 'ความเสี่ยงปานกลาง';
                        let riskColor = '#f57c00';
                        if(pin.risk === 'high') { riskText = 'ความเสี่ยงสูง'; riskColor = '#d32f2f'; }
                        else if(pin.risk === 'low') { riskText = 'ความเสี่ยงน้อย'; riskColor = '#fbc02d'; }

                        const card = document.createElement('div');
                        card.className = 'pending-card';
                        
                        let imgHtml = '';
                        if (pin.image) {
                            imgHtml = `<img src="${pin.image}" class="pending-img">`;
                        }

                        card.innerHTML = `
                            <div id="mini-map-${key}" class="mini-map"></div>
                            
                            <div class="pending-info">
                                <div class="pending-title">${pin.title} <span style="font-size:0.85rem; color:${riskColor};">(${riskText})</span></div>
                                <div class="pending-detail"><strong>รายละเอียด:</strong> ${pin.detail}</div>
                                ${imgHtml}
                                <div class="pending-meta">
                                    🕒 <strong>วันเวลาที่แจ้ง:</strong> ${timeString}<br>
                                    📍 <strong>พิกัด GPS:</strong> ${pin.lat.toFixed(5)}, ${pin.lng.toFixed(5)}
                                </div>
                                <div class="btn-group">
                                    <button class="btn-approve" onclick="updatePinStatus('${key}', 'approved')">✅ อนุมัติ (เปลี่ยนเป็นสีตามระดับความเสี่ยง)</button>
                                    <button class="btn-reject" onclick="updatePinStatus('${key}', 'rejected')">❌ ปฏิเสธ / ลบทิ้ง</button>
                                </div>
                            </div>
                        `;
                        listEl.appendChild(card);

                        setTimeout(() => {
                            const miniMap = L.map(`mini-map-${key}`, {
                                zoomControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false
                            }).setView([pin.lat, pin.lng], 15);
                            
                            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).setItemRef?.();
                            L.marker([pin.lat, pin.lng]).addTo(miniMap);
                        }, 100);
                    }
                });
            }

            if (!hasPending) {
                listEl.innerHTML = '<div class="empty-state">🎉 ไม่มีรายการรอตรวจสอบในขณะนี้!</div>';
            }
        });

        function updatePinStatus(pinKey, newStatus) {
            if (newStatus === 'approved') {
                db.ref(`safeZonePins/${pinKey}`).update({ status: 'approved' })
                    .then(() => alert('อนุมัติเรียบร้อย! หมุดบนแผนที่หลักเปลี่ยนเป็นสีตามระดับความเสี่ยงแล้วครับ'));
            } else {
                db.ref(`safeZonePins/${pinKey}`).remove()
                    .then(() => alert('ปฏิเสธและลบข้อมูลสแปมเรียบร้อยแล้วครับ'));
            }
        }
    </script>
</body>
</html>
